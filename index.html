  },
  earning: { title: "Compensation", col1: "Description", col2: "Hours", col3: "Amount", col4: "YTD", total: "Total Compensation" },
  earnings: [
    { name: "Monthly Contract Compensation", value: DEFAULT_COMPENSATION },
  ],
  deduction: { title: "Tax & Deductions", col1: "Description", col2: "Hours", col3: "Amount", total: "Total Withholdings" },
  deductions: [
    { name: "Monthly Contract Compensation", value: 0 },
    { name: "Other Withholdings", value: 0 },
  ],
  payments: {
    title: "Payment Details",
    col1: "Payment",
    col2: "Payment Date",
    col3: "Amount",
    col4: "Payment Method",
    total: "Total Paid",
    rows: Array.from({ length: DEFAULT_INSTALLMENTS }, (_, i) => ({
      name: `Installment ${i + 1}`,
      date: null,
      value: DEFAULT_COMPENSATION / DEFAULT_INSTALLMENTS,
      method: "Bank Transfer",
    })),
  },
  note: {
    title: "Payment Notes",
    tax: "No taxes or other deductions are withheld by the Company. The Contractor is responsible for applicable taxes and statutory obligations in their country of residence.",
    content: "",
  },
  issuedBy: {
    title: "Issued By",
    name: "Jane Doe",
    email: "accounts@acmecorp.com",
  },
  footer:
    "This document is electronically generated and is valid without a physical signature or company seal. For verification, please contact the issuing company using the official contact information provided above.\nThis document contains confidential information and is intended solely for the contractor named herein.",
}, migrateStatementData);

const setting = persisted("setting", {
  primaryColor: "#2563eb",
  secondaryColor: "#f1f1f1",
  border: "#f2f2f2",
  fontFamily: "fontRoboto",
  currency: "USD",
  payPeriodMode: "contractMonth",
  showHours: false,
  maskAccount: true,
  logoHeight: 40,
  fullWidthTables: false,
  showYtd: false,
  autoYtd: false,
  monthlySalary: DEFAULT_COMPENSATION,
});

if (setting.maskAccount === undefined) setting.maskAccount = true;
if (!setting.logoHeight) setting.logoHeight = 40;
if (setting.fullWidthTables === undefined) setting.fullWidthTables = false;
if (setting.showYtd === undefined) setting.showYtd = false;
if (setting.autoYtd === undefined) setting.autoYtd = false;
if (setting.monthlySalary === undefined) setting.monthlySalary = DEFAULT_COMPENSATION;
/* The old half-month range mode cannot express a monthly compensation period,
   so move it to the full-month mode once. */
if (!setting.periodModeMigrated) {
  if (setting.payPeriodMode === "range") setting.payPeriodMode = "contractMonth";
  setting.periodModeMigrated = true;
}

const info = reactive({ showInfo: false });

/* ------------------------------------------------------------ data i/o */

const resetAllData = () => {
  for (const key of STORAGE_KEYS) localStorage.removeItem(key);
  window.location.reload();
};

/* Re-run cleanup migrations against the stored document, pruning rows/fields
   that the current UI no longer includes (e.g. a label that was removed from
   defaults after this document was first saved). */
const fixSaveData = () => {
  try {
    const raw = localStorage.getItem("payslipData");
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.migrations) {
        delete d.migrations.countryRemoved;
        localStorage.setItem("payslipData", JSON.stringify(d));
      }
    }
  } catch (e) { /* ignore malformed storage */ }
  window.location.reload();
};

const exportData = () => {
  const data = {};
  for (const key of STORAGE_KEYS) {
    const val = localStorage.getItem(key);
    if (val) data[key] = JSON.parse(val);
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "payment-statement-data.json";
  a.click();
  URL.revokeObjectURL(url);
};

const importData = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json";
  input.onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        for (const key of STORAGE_KEYS) {
          if (data[key]) localStorage.setItem(key, JSON.stringify(data[key]));
        }
        window.location.reload();
      } catch (err) {
        window.alert("Invalid JSON file.");
      }
    };
    reader.readAsText(file);
  };
  input.click();
};

/* --------------------------------------------------------- dark mode */

const readStored = (key) => {
  try { return localStorage.getItem(key); } catch (e) { return null; } // private mode / blocked storage
};

const colorMode = ref(readStored("colorMode") || "light");
watchEffect(() => {
  document.documentElement.classList.toggle("dark", colorMode.value === "dark");
  try { localStorage.setItem("colorMode", colorMode.value); } catch (e) {}
});
</script>

<script>
/* ------------------------------------------------------------ Editable */

const Editable = {
  template: "#tpl-editable",
  props: {
    modelValue: { type: [String, Number], default: undefined },
    as: { type: String, default: "p" },
    type: { type: String, default: "text" },
  },
  emits: ["update:modelValue"],
  setup(props, { emit }) {
    const el = ref(null);

    /* Amounts always carry two decimals, zero included, so a withheld total of
       nothing reads as an explicit 0.00 rather than a blank or a dash. */
    const formatNumber = (num) => {
      if (num === undefined || num === null || num === "") return "";
      if (isNaN(num)) return num;
      return new Intl.NumberFormat("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(num);
    };

    const updateElement = (val) => {
      const node = el.value && el.value.$el ? el.value.$el : el.value;
      if (!node) return;
      if (props.type === "number") {
        const n = Number(val);
        node.textContent = !isNaN(n) ? formatNumber(n) : "";
      } else {
        /* An empty field stays genuinely empty: the "—" a reader sees is drawn
           by `.editable-field:empty::before`, so it can never be picked up by
           `commit` and stored as if it were the value. */
        node.textContent = val != null ? val : "";
      }
    };

    /* Edits are committed on every keystroke, not just on blur, so a reload,
       a print dialog or a closed tab never drops what was typed. `lastEmitted`
       lets the incoming-value watcher tell our own echo apart from a genuine
       outside change: rewriting textContent mid-typing would reset the caret. */
    let lastEmitted;

    const commit = (final) => {
      const node = el.value && el.value.$el ? el.value.$el : el.value;
      if (!node) return;

      let value = (node.textContent || "").trim();

      if (props.type === "number") {
        // An empty box mid-edit is someone clearing the field to retype; only
        // settle it to 0 once they leave.
        if (value === "" && !final) return;
        const parsed = parseFloat(value.replace(/[^0-9.-]+/g, ""));
        value = isNaN(parsed) ? 0 : parsed;
        // Reformatting while typing would fight the caret, so only on blur.
        if (final) node.textContent = formatNumber(value);
      }

      lastEmitted = value;
      emit("update:modelValue", value);
    };

    const onInput = () => commit(false);
    const onBlur = () => commit(true);

    onMounted(() => updateElement(props.modelValue));
    watch(() => props.modelValue, (v) => {
      if (v === lastEmitted) return;
      updateElement(v);
    });

    return { el, onInput, onBlur };
  },
};

/* ------------------------------------------------------------- Tooltip */

const Tooltip = {
  template: "#tpl-tooltip",
  props: { text: { type: String, required: true } },
  setup() {
    return { show: ref(false) };
  },
};

/* -------------------------------------------------------- ImageCropper */

const ImageCropper = {
  template: "#tpl-image-cropper",
  props: { modelValue: { type: String, default: null } },
  emits: ["update:modelValue"],
  setup(props, { emit }) {
    const open = ref(false);
    /* The logo scales by height only; width follows the image's own ratio. */
    const logoStyle = computed(() => ({ height: `${setting.logoHeight || 40}px` }));
    const cropImg = ref(props.modelValue);
    const imgSrc = ref(props.modelValue);
    const inputFile = ref(null);
    const imgEl = ref(null);
    let cropper = null;

    watch(() => props.modelValue, (v) => { cropImg.value = v; });

    const destroy = () => {
      if (cropper) { cropper.destroy(); cropper = null; }
    };

    const initCropper = async () => {
      await nextTick();
      if (!imgEl.value) return;
      destroy();
      cropper = new Cropper(imgEl.value, {
        /* Free ratio and viewMode 0: logos come in every shape, and the crop
           box must be able to hold the whole image (and zoom out past the
           frame) instead of forcing a 4:1 slice. The payslip renders the
           result with object-contain, so any ratio displays correctly. */
        viewMode: 0,
        autoCropArea: 1,
      });
    };

    const setImage = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("Please select an image file");
        return;
      }

      const reader = new FileReader();
      reader.onload = (ev) => {
        imgSrc.value = ev.target.result;
        open.value = true;
        initCropper();
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    };

    const close = () => { open.value = false; destroy(); };

    const cropImage = () => {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas();
      cropImg.value = canvas.toDataURL();
      emit("update:modelValue", cropImg.value);
      close();
    };

    const rotate = (deg) => cropper && cropper.rotate(deg);
    const reset = () => cropper && cropper.reset();
    const zoom = (percent) => cropper && cropper.zoom(percent);
    const showFileChooser = () => inputFile.value && inputFile.value.click();

    return { open, cropImg, imgSrc, inputFile, imgEl, logoStyle, setImage, close, cropImage, rotate, reset, zoom, showFileChooser };
  },
};

/* ------------------------------------------------------------ Settings */

const AppSettings = {
  template: "#tpl-settings",
  components: { Tooltip },
  setup() {
    const open = ref(false);

    /* The panel previews the YTD maths, so it reads the same shared stores the
       document does rather than taking them as props. */
    const currentCompensation = computed(() =>
      payslipData.earnings.reduce((acc, item) => acc + Number(item.value || 0), 0));

    const ytdMonths = computed(() => {
      const month = parseInt(String(payslipData.statement.period.month || "").split("-")[1], 10);
      return month || 0;
    });

    const ytdPreview = computed(() => {
      const salary = Number(setting.monthlySalary || 0);
      const months = ytdMonths.value;
      if (!months) return "Select a payment period to calculate YTD.";
      const money = (n) => `${setting.currency} ${new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n)}`;
      return `${money(salary)} x ${months} month${months > 1 ? "s" : ""} = ${money(salary * months)}`;
    });

    const fonts = [
      { label: "Open Sans", id: "fontOpenSans" },
      { label: "Roboto", id: "fontRoboto" },
      { label: "Poppins", id: "fontPoppins" },
      { label: "Inter", id: "fontInter" },
      { label: "Lato", id: "fontLato" },
      { label: "Spectral", id: "fontSpectral" },
      { label: "Merriweather", id: "fontMerriweather" },
    ];

    const currencys = ["USD", "EUR", "GBP", "AUD", "CAD", "NZD", "CHF", "JPY", "CNY"];

    const payPeriodModes = [
      { label: "Full Contract Month (01 – 31)", id: "contractMonth" },
      { label: "Date Range (start - end)", id: "range" },
      { label: "Single Date", id: "single" },
      { label: "Month & Year Only", id: "month" },
    ];

    const isDark = computed({
      get: () => colorMode.value === "dark",
      set: (v) => { colorMode.value = v ? "dark" : "light"; },
    });

    const print = () => window.print();
    const confirmReset = () => {
      if (window.confirm("Reset all data to defaults? This cannot be undone.")) resetAllData();
    };

    /* The slider moves in 2px steps; the -/+ buttons allow 1px nudges. */
    const LOGO_MIN = 20;
    const LOGO_MAX = 120;
    const nudgeLogo = (delta) => {
      const next = Number(setting.logoHeight || 40) + delta;
      setting.logoHeight = Math.min(LOGO_MAX, Math.max(LOGO_MIN, next));
    };

    return { setting, info, open, fonts, currencys, payPeriodModes, isDark, print, confirmReset, fixSaveData, exportData, importData, nudgeLogo, LOGO_MIN, LOGO_MAX, currentCompensation, ytdMonths, ytdPreview };
  },
};

/* ---------------------------------------------------------------- root */

const App = {
  template: "#tpl-app",
  components: { Editable, Tooltip, ImageCropper, AppSettings },
  setup() {
    const data = payslipData;

    const earning = computed(() => data.earnings.reduce((acc, item) => acc + Number(item.value || 0), 0));
    const deduction = computed(() => data.deductions.reduce((acc, item) => acc + Number(item.value || 0), 0));
    /* Year-to-date figures are entered per row, not derived: this document only
       knows about one period, so the running total has to come from the user. */
    const netCompensation = computed(() => earning.value - deduction.value);
    const totalPaid = computed(() => data.payments.rows.reduce((acc, row) => acc + Number(row.value || 0), 0));

    const formatAmount = (amount) => new Intl.NumberFormat("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    }).format(Number(amount || 0));

    const formatCurrency = (amount) => `${setting.currency} ${formatAmount(amount)}`;

    /* ----------------------------------------------------- pay period */

    /* The compensation period is always a whole month; the second installment
       landing in the following month does not move it.

       Only the contract-month mode edits `period.month` directly — every other
       mode edits the period text — so the source has to follow the mode, or the
       statement number, the payment row names, the YTD month count and the
       document title all keep reporting the month that was last picked in
       contract-month mode. */
    const periodParts = computed(() => {
      const periodMonth = setting.payPeriodMode === "contractMonth"
        ? data.statement.period.month
        : (monthOfDateStr(data.statement.period.start) || data.statement.period.month);
      const [yearStr, monthStr] = String(periodMonth || "").split("-");
      const year = parseInt(yearStr, 10);
      const month = parseInt(monthStr, 10);
      if (!year || !month) return null;
      return { year, month };
    });

    const contractPeriodText = computed(() => {
      const p = periodParts.value;
      if (!p) return "";
      return `${formatDateLong(p.year, p.month, 1)} – ${formatDateLong(p.year, p.month, lastDayOfMonth(p.year, p.month))}`;
    });

    /* Months of the year covered by this statement: a September period means
       nine monthly payments have been made, January through September. */
    const ytdMonths = computed(() => (periodParts.value ? periodParts.value.month : 0));

    /* The saved monthly salary drives the first compensation row, which is the
       recurring one; any extra rows fall back to their own amount. */
    const rowYtd = (item, index) => {
      if (!setting.autoYtd) return Number(item.ytd || 0);
      const monthly = index === 0 ? Number(setting.monthlySalary || 0) : Number(item.value || 0);
      return monthly * ytdMonths.value;
    };

    const earningYtd = computed(() => data.earnings.reduce((acc, item, index) => acc + rowYtd(item, index), 0));

    // Keep the plain start/end strings in step with the selected month so the
    // other period modes (and exported JSON) stay coherent.
    watch(() => data.statement.period.month, (month) => {
      if (setting.payPeriodMode !== "contractMonth") return;
      const p = periodParts.value;
      if (!month || !p) return;
      const mm = String(p.month).padStart(2, "0");
      data.statement.period.start = fromISODate(`${p.year}-${mm}-01`);
      data.statement.period.end = fromISODate(`${p.year}-${mm}-${lastDayOfMonth(p.year, p.month)}`);
    }, { immediate: true });

    const onContractMonthChange = (e) => {
      if (e.target.value) data.statement.period.month = e.target.value;
    };

    /* Dates that hang off the selected period: the statement is issued on the
       3rd of the following month, the first payment lands on the 16th of the
       period month and the second on the 2nd of the following month. Extra
       rows keep whatever date they were given. Only fires when the period is
       actually changed, so a saved document opens with its own dates intact. */
    const nextMonthOf = ({ year, month }) => (month === 12 ? { year: year + 1, month: 1 } : { year, month: month + 1 });

    const applyPeriodDates = () => {
      const p = periodParts.value;
      if (!p) return;
      const next = nextMonthOf(p);
      const iso = (d, day) => `${d.year}-${String(d.month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      data.statement.issued.date = fromISODate(iso(next, 3));
      const rows = data.payments.rows;
      if (rows[0]) rows[0].date = fromISODate(iso(p, 16));
      if (rows[1]) rows[1].date = fromISODate(iso(next, 2));
    };

    watch(() => data.statement.period.month, applyPeriodDates);

    const onPeriodStartChange = (e) => {
      if (e.target.value) data.statement.period.start = fromISODate(e.target.value);
    };

    const onPeriodEndChange = (e) => {
      if (e.target.value) data.statement.period.end = fromISODate(e.target.value);
    };

    // Whole-month period: "Mar 2027" for display, with the hidden range kept
    // in sync so switching back to range mode gives 01 Mar - 31 Mar.
    const setPeriodMonth = (year, month) => {
      data.statement.period.start = `${MONTHS[month - 1]} ${year}`;
      data.statement.period.end = fromISODate(`${year}-${String(month).padStart(2, "0")}-${lastDayOfMonth(year, month)}`);
    };

    const onPeriodMonthChange = (e) => {
      const val = e.target.value;
      if (!val) return;
      const [year, month] = val.split("-");
      setPeriodMonth(parseInt(year, 10), parseInt(month, 10));
    };

    // The statement date is when the document was issued; it never moves the
    // compensation period.
    const onIssueDateChange = (e) => {
      if (e.target.value) data.statement.issued.date = fromISODate(e.target.value);
    };

    // Keep the stored period text in a shape that matches the selected mode.
    watch(() => setting.payPeriodMode, (mode) => {
      /* Contract-month mode reads `period.month`, so hand the month the other
         modes were showing back to it; without this, switching into contract
         month silently reverts the document to an older period. */
      if (mode === "contractMonth") {
        const month = monthOfDateStr(data.statement.period.start);
        if (month) data.statement.period.month = month;
      }
      const parts = String(data.statement.period.start || "").trim().split(/\s+/);
      if (mode === "month" && parts.length === 3) {
        data.statement.period.start = `${parts[1]} ${parts[2]}`;
      } else if (mode !== "month" && parts.length === 2) {
        data.statement.period.start = `01 ${parts[0]} ${parts[1]}`;
      }
    });

    /* -------------------------------------------------- statement number */

    // Deterministic and derived from the period, so re-opening the same month
    // always yields the same number. An edited value is kept verbatim.
    // The prefix is the contractor's initials ("John Smith" -> "JS"), falling
    // back to the stored prefix while the name is still empty.
    const statementPrefix = computed(() => {
      const initials = String(data.contractor.name || "")
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .map((word) => word[0])
        .join("")
        .toUpperCase();
      return initials || data.statement.number.prefix || "PCS";
    });

    const autoStatementNo = computed(() => {
      const p = periodParts.value;
      const prefix = statementPrefix.value;
      if (!p) return prefix;
      return `${prefix}${p.year}${String(p.month).padStart(2, "0")}`;
    });

    const statementNo = computed(() => data.statement.number.value || autoStatementNo.value);

    const setStatementNo = (val) => {
      const next = String(val || "").trim();
      data.statement.number.value = next === autoStatementNo.value ? "" : next;
    };

    /* ------------------------------------------------------- installments */

    /* Rows are named after the period they belong to ("September Payment #1").
       The name stays editable: only names still matching the generated shape
       (or the old "Installment n" default) are rewritten when the period or
       the row order changes, so a hand-written label is never clobbered. */
    const autoPaymentName = (index) => {
      const p = periodParts.value;
      const month = p ? MONTHS_LONG[p.month - 1] : "";
      return month ? `${month} Payment #${index + 1}` : `Payment #${index + 1}`;
    };

    const isAutoPaymentName = (name) => {
      const text = String(name || "").trim();
      if (!text) return true;
      if (/^Installment \d+$/i.test(text)) return true;
      const months = MONTHS_LONG.join("|");
      return new RegExp(`^(?:(?:${months}) )?Payment #\\d+$`, "i").test(text);
    };

    const renamePayments = () => {
      data.payments.rows.forEach((row, index) => {
        if (isAutoPaymentName(row.name)) row.name = autoPaymentName(index);
      });
    };

    watch(
      () => [periodParts.value ? periodParts.value.month : 0, data.payments.rows.length],
      renamePayments,
      { immediate: true },
    );

    const addInstallmentRow = () => {
      const rows = data.payments.rows;
      const remaining = Math.max(netCompensation.value - totalPaid.value, 0);
      rows.push({ name: autoPaymentName(rows.length), date: null, value: remaining, method: "Bank Transfer" });
    };

    const removeInstallmentRow = (index) => {
      if (index >= 0 && index < data.payments.rows.length) data.payments.rows.splice(index, 1);
    };

    const onInstallmentDateChange = (index, e) => {
      if (e.target.value) data.payments.rows[index].date = fromISODate(e.target.value);
    };

    /* Screen-only integrity hints; nothing here reaches the printed page. */
    const paymentWarning = computed(() => {
      const rows = data.payments.rows;
      if (!rows.length) return "No installments recorded yet.";
      if (Math.abs(totalPaid.value - netCompensation.value) > 0.005) {
        return `Installments total ${formatCurrency(totalPaid.value)} but compensation payable is ${formatCurrency(netCompensation.value)}.`;
      }
      const missing = rows.filter((row) => !row.date).length;
      if (missing) return `${missing} installment${missing > 1 ? "s have" : " has"} no payment date yet.`;
      return "";
    });

    /* -------------------------------------------------------------- notes */

    // Only claim that nothing is withheld while nothing actually is.
    const showTaxNote = computed(() => deduction.value === 0 && !!data.note.tax);

    /* ------------------------------------------------------ bank masking */

    const isMasked = (item) => !!(item.mask && setting.maskAccount && item.value);

    const maskAccount = (value) => {
      const raw = String(value || "").trim();
      if (/[X*•]/i.test(raw)) return raw; // already masked in the stored data
      const digits = raw.replace(/\D/g, "");
      if (digits.length <= 4) return raw;
      return `XXXX XXXX ${digits.slice(-4)}`;
    };

    /* --------------------------------------------------------------- rows */

    const addEarningRow = () => data.earnings.push({ name: "New Line Item", hours: 0, value: 0, ytd: 0 });
    const removeEarningRow = (index) => {
      if (index >= 0 && index < data.earnings.length) data.earnings.splice(index, 1);
    };

    const addDeductionRow = () => data.deductions.push({ name: "New Withholding", hours: 0, value: 0 });
    const removeDeductionRow = (index) => {
      if (index >= 0 && index < data.deductions.length) data.deductions.splice(index, 1);
    };

    /* -------------------------------------------------------------- misc */

    const cssVars = computed(() => ({
      "--theme-primary": setting.primaryColor,
      "--theme-secondary": setting.secondaryColor,
      "--theme-border": setting.border,
    }));

    const title = computed(() => {
      const p = periodParts.value;
      const who = String(data.contractor.name || "").trim();
      const period = p ? `${MONTHS_LONG[p.month - 1]} ${p.year}` : (data.statement.period.start || "");
      return [statementNo.value, who, period].filter(Boolean).join(" · ") || "Contractor Payment Statement";
    });

    watchEffect(() => { document.title = title.value; });

    /* Chrome, Edge and Firefox seed the "Save as PDF" filename from the
       document title, so the statement number stands in for the window title
       for the duration of the print job: the file lands as "JS202609.pdf"
       instead of "JS202609 · John Smith · September 2026.pdf". Characters no
       filesystem accepts are dropped, and an empty result falls back to the
       normal title rather than leaving the browser with nothing to name. */
    const printFileName = computed(() => {
      const name = String(statementNo.value || "").replace(/[\\/:*?"<>|]+/g, "").trim();
      return name || title.value;
    });

    window.addEventListener("beforeprint", () => { document.title = printFileName.value; });
    window.addEventListener("afterprint", () => { document.title = title.value; });

    return {
      data, setting, info, cssVars, storageError,
      earning, deduction, earningYtd, rowYtd, ytdMonths, netCompensation, totalPaid,
